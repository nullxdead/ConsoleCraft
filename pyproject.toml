[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "console-launcher"
version = "4.4.0"
description = "Console Launcher — terminal Minecraft Java launcher by 0xdead, Frosty and Qwertyks"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-ConsoleLauncher"
authors = [{name = "0xdead"}, {name = "Frosty"}, {name = "Qwertyks"}]
keywords = ["minecraft", "launcher", "console", "cross-platform"]
classifiers = [
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "minecraft-launcher-lib>=8.0,<9",
  "rich>=13.7,<16",
  "platformdirs>=4.2,<5",
  "requests>=2.32,<3",
  "keyring>=25,<26",
  "questionary>=2,<3",
  "pypresence>=4.6.2,<5",
]

[project.optional-dependencies]
build = ["build>=1.2,<2"]
bundle = ["pyinstaller>=6.16,<7"]

[project.urls]
Homepage = "https://github.com/nullxdead/ConsoleLauncher"
Telegram = "https://t.me/CCLauncher"
Discord = "https://discord.gg/FtqBFt58w"
Issues = "https://github.com/nullxdead/ConsoleLauncher/issues"

[project.scripts]
consolelauncher = "consolecraft.cli:main"
consolecraft = "consolecraft.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["consolecraft*"]
